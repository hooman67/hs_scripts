# The pip indices to use - Adobe's mirror for pypi
# If skipped , we just use pypi itself.
index: https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-remote/simple

extra_indices:
  # extra_index_urls is not recommended, but we need for genie and adobeone -- first put genie index then adobeone
  # order matters for UV. If it finds genie on adobeone with different version but not matching one, it errors out.
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-kineto-release/simple
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-piat-release/simple
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-adobeone-release/simple
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-adobeshared-release/simple
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-clio-release/simple
  - https://artifactory-uw2.adobeitc.com/artifactory/api/pypi/pypi-eval-service-common-release-local/simple

no_isolation_deps:
  # Sadly some deps like flash attention don't properly set their build time dependencies :(
  # so we need to install their deps before hand and use no build isolation
  # This is an anti-pattern; but what can we do in face of bad dependencies
  #
  # Use this section to set all the deps that need to be installed before hand in the env
  - numpy
  - ninja
  - setuptools
  - setuptools_scm
  - torch

requirements:
  local:
    # These are the things you definitely want installed.
    # Relative to root of Mori
    - /collections/cliocore/diffusion_core
    - /collections/cliocore/core_models/unets
    - /collections/cliocore/core_models/cldm
    - /collections/cliocore/core_models/autoencoders
    - /collections/cliocore/core_models/encoders
    - /collections/cliocore/core_models/latent_transformers
    - /collections/cliocore/prototyping_tools
    - /collections/cliocore/typings
    - /collections/cliocore/process_utils
    - /collections/genai_foundation
    - /collections/clio4
    - /collections/validate_mori_release
    - /collections/foundation_exploration
    - ../image_model_metrics
    - /collections/vae_core

  colligo:
    # Anything that is needed to be installed from colligo via install-colligo-pkg.py
    - colligo.pluto.lineage
    - colligo.models.common.diffusion
    - colligo.models.common.asml_generation_utils

  pip:
    # These are extra packages that we need to install.
    # FIXME: ideally all packages in `local` should set their deps and we should not
    # mention these. But if that is missing you can add here. You should also mention
    # the dependencies of anything in the `colligo` section
    - boto3
    - botocore
    - fastapi
    - flash-attn
    - flashattn-hopper
    - sageattention
    - genie
    - genie-contrib
    - GPUtil
    - newrelic
    - prometheus_client
    - protobuf
    - python-etcd
    - pyyaml
    - setuptools
    - torch
    - torchaudio
    - triton
    - urllib3
    - xformers
    - uvicorn
    - awscli
    - colligo.s3_training_cache
    - clio.vigilant
    - adobeocrmaskrcnnutil
    - maskrcnn-benchmark
    - ocreval
    - torchao
    - newrelic
    - s3fs
    - loguru
    - eval-service-common
    - av
    - liger-kernel
    - scikit-image
    - nvidia-ml-py3
    - easydict
    - s3torchconnector
    - decord
    - lpips
    - rich
    - mori
    - torch_tb_profiler
    - portion
    - tensorboard
    - duckdb
    # We don't really need pip, but add it so people don't get surprised
    - pip

