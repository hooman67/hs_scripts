visibility: public
public:
  files:
  - types.py
  deps:
  - colligo.base
has_build_module: true

# Use vllm_serve environment for PyTorch 2.9 compatibility with foundation_exploration
# (t2x_inference.py works on PyTorch 2.9, matching Gen6 diffusion model pattern)
custom_pyenv: ff_services_gr6

deps:
- einops
- ff-vendored-gr6
- mori
- numpy
- omegaconf
- torch
- torchaudio
